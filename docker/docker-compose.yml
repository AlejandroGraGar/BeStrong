services:

  # ─── Aplicación PHP + Nginx ────────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
      network: host             # Red del host solo durante el build
    image: bestrong-app
    container_name: bestrong_app
    ports:
      - "80:80"                 # http://localhost
    volumes:
      - ..:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_storage:/var/www/html/storage           # Aislado: permisos gestionados en build
      - app_bootstrap_cache:/var/www/html/bootstrap/cache  # Ídem
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

  # ─── Vite dev server (hot reload de CSS/JS) ────────────────────────────────
  vite:
    build:
      context: ..
      dockerfile: docker/Dockerfile.vite
      network: host             # Red del host solo durante el build
    image: bestrong-vite
    container_name: bestrong_vite
    ports:
      - "5173:5173"             # http://localhost:5173
    volumes:
      - ..:/app
      - vite_node_modules:/app/node_modules

volumes:
  app_vendor:          # vendor/ de Composer
  app_storage:         # storage/ con permisos gestionados en contenedor
  app_bootstrap_cache: # bootstrap/cache/ ídem
  vite_node_modules:   # node_modules de npm
