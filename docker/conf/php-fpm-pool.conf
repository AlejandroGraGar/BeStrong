; Pool de PHP-FPM configurado para correr como el usuario del host.
; El user/group se sobreescribe en runtime desde el entrypoint con HOST_UID/HOST_GID.
[www]
user  = 1000
group = 1000

listen = 127.0.0.1:9000
listen.owner = root
listen.group = root

pm                   = dynamic
pm.max_children      = 5
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Pasar las variables de entorno del contenedor al proceso PHP
clear_env = no
